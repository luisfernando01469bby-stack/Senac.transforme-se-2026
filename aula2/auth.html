<h2>Meu formulário</h2>
<p>Preencha as informações abaixo</p>
<form id="formRegister">


    Nome:
     <input id="iName" type="text" placeholder="Digite seu nome completo"/>
    Email: <input id="iEmail" placeholder="Digite seu melhor email"/><br>
    Senha: <input id="iPass" placeholder="Letra maiuscula e números"/><br>
    Data de nascimento: <input id="iBirth" type="date"/>
    <button type="submit">Salvar</button>
    </form>  
    <h2>Resposta</h2>
    <p id="pResponse"</p>

    <script>
        var users = []
        //document é a página toda
        // get= pegar, elemento = elemento do html
        var formR = document.getElementById("formRegister");
        formR.addEventListener("submit", (e)=>{
            e.preventDefault(); //impede atualizar a tela
                let name = document.getElementById("iName").value
                let email = document.getElementById("iEmail").value
                let pass = document.getElementById("iPass").value
                let birth = document.getElementById("iBirth").value;
                
                const user = {//objeto anônimo, estrutura, json
                   nome: name,
                   email: email,
                   senha: pass,
                   nascimento: birth
                } 

                users.push(user)

                let response = document.getElementById("pResponse")
                response.innerHTML = JSON.stringify(users, null);
            })
    </script>
