<h2>Meu formulário</h2>
<p>Preencha as informações abaixo</p>
<form id="formRegister">


    Nome:
    <input id="iName" type="text" placeholder="Digite seu nome completo" />
    Email: <input id="iEmail" placeholder="Digite seu melhor email" /><br>
    Senha: <input id="iPass" placeholder="Letra maiuscula e números" /><br>
    Data de nascimento: <input id="iBirth" type="date" />
    <button type="submit">Salvar</button>
</form>
<h2>Resposta</h2>
<p id="pResponse" </p>



<form id="formLogin">

    Email: <input id="iEmailLogin" placeholder="Digite seu email cadastrado" />
    <br>
    Senha: <input id="iLoginpass" placeholder="Digite sua senha cadastrada" />
    <br>
    <button type="submit">Entrar</button>
</form>
